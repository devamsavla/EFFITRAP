[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effitrap"
version = "1.0.0"
description = "Algorithms for escaping AI's efficiency trap: carbon-aware scheduling, budgeted model routing, batching and speculative decoding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NYU CS-GY 6033G, Student N18349850" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "scipy>=1.11", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
effitrap = "effitrap.cli:main"

[tool.setuptools]
packages = ["effitrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
